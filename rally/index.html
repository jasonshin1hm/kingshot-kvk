<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KvK 캐슬 랠리 편성 · KOR #737</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --bg:#0F131A;--panel:#141922;--card:#171C25;--line:#2A313D;--line2:#262D39;--row:#1F2530;--rowline:#2E3644;
  --text:#E8EAEE;--muted:#9AA3AF;--muted2:#8E97A5;--gold:#E0B252;--gold2:#F2C866;--goldbg:#2B2412;
  --atk:#F0B8A0;--atkring:#C9826A;--def:#9CC7F5;--defring:#5B9BE0;--danger:#E57373;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.35}
input,select{font-family:inherit}
img{display:block}
a{color:var(--gold)}a:hover{color:var(--gold2)}

/* header */
.hdr{background:var(--panel);border-bottom:1px solid var(--line2);padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--gold)}
.brand h1{margin:0;font-size:19px;font-weight:900}
.brand .sub{font-size:12px;color:var(--muted)}
.brand .sub a{color:var(--muted);text-decoration:none;margin-left:8px}.brand .sub a:hover{color:var(--gold2)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:4px}
.tab{height:32px;padding:0 14px;border-radius:7px;border:none;font-size:13px;font-weight:700;background:transparent;color:#C3C9D2}
.tab.on{background:var(--gold);color:#1A1406}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid #333B48;background:transparent;color:#C3C9D2;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4A5363}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1406}
.btn.active{background:var(--goldbg);border-color:var(--gold);color:var(--gold2)}
.btn.danger{color:#F2A3A3;border-color:#5A3434}
.seg{display:flex;border:1px solid #333B48;border-radius:8px;overflow:hidden}
.seg button{height:34px;width:40px;border:none;font-size:12px;font-weight:700;background:transparent;color:#C3C9D2}
.seg button.on{background:var(--text);color:#12161E}
.pill{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#5C6573}
.pill.ok .dot{background:#6FCF8A}.pill.busy .dot{background:var(--gold)}.pill.err .dot{background:var(--danger)}
.admin-chip{font-size:12px;color:var(--gold2);background:var(--goldbg);border:1px solid #5A4A22;border-radius:999px;padding:3px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{max-width:1400px;margin:0 auto;padding:20px 20px 64px;display:flex;flex-direction:column;gap:26px}
.banner{background:var(--goldbg);border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.banner.warn{background:#2A1A1A;border-color:#7A3A3A;color:#F2A3A3}

/* leaders */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.cap{background:var(--bg);padding:2px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lead{display:flex;align-items:center;gap:12px}
.lead img,.lead .ph{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
.lead .ph{display:flex;align-items:center;justify-content:center;background:#232A36;border-style:dashed;border-color:#4A5363;font-size:20px;font-weight:900;color:#C3C9D2}
.role{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.role.main{background:#3A2E12;color:var(--gold2)}.role.sub{background:#1D2D40;color:var(--def)}
.lname{font-size:21px;font-weight:900;line-height:1.1}
.hbox{border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:10px}
.hbox.atk{background:#1E1A14;border:1px solid #3B3224}.hbox.def{background:#141B22;border:1px solid #243444}
.hbox .meta{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.hlabel{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.atk .hlabel{color:var(--atk)}.def .hlabel{color:var(--def)}
.faces{display:flex;gap:6px;flex:none}
.fbtn{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:46px}
.fbtn span{font-size:10px;color:#C3C9D2;white-space:nowrap;max-width:46px;overflow:hidden;text-overflow:ellipsis}
.fbtn[disabled]{opacity:1;cursor:default}
.face{border-radius:50%;flex:none;object-fit:cover;object-position:center;background:#2A303B;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.face.atk{border-color:var(--atkring)}.face.def{border-color:var(--defring)}
.face.empty{background:transparent;border-style:dashed;color:#7F8896}

.ratio{background:none;border:none;padding:1px 4px;margin-left:-4px;border-radius:5px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none;cursor:default}
.ratio .k{color:var(--muted)}
.ratio .pen{opacity:0;transition:opacity .12s}
.admin .ratio{cursor:pointer}
.admin .ratio:hover{background:rgba(224,178,82,.12)}
.admin .ratio:hover .pen,.admin .ratio:focus-visible .pen{opacity:1}
@media (hover:none){.admin .ratio .pen{opacity:.6}}
.rin{height:26px;background:#11151C;color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:0 6px;font-size:12px}

.jhead{display:flex;align-items:baseline;gap:8px}
.jhead b{font-size:14px;font-weight:900}.jhead span{font-size:12px;color:var(--muted)}
.cnt{margin-left:auto;font-size:16px;font-weight:900}
.cnt.full{color:#F2A3A3}.cnt.good{color:#8FD19E}
.guide{background:#12161D;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.guide .gt{font-size:11px;font-weight:700;color:var(--muted)}
.grow{display:flex;align-items:center;gap:8px;min-height:28px}
.badge{border-radius:4px;padding:2px 7px;font-weight:700;font-size:11px;flex:none}
.badge.atk{background:#3B2A22;color:var(--atk)}.badge.def{background:#1D2D40;color:var(--def)}
.gfaces{display:flex;gap:4px;margin-left:auto}
.gtext{flex:1 1 100px;min-width:0}

.slots{display:flex;flex-direction:column;gap:5px}
.shead{display:flex;align-items:center;gap:6px;padding:0 20px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
.shead .n{width:14px;flex:none}.shead .nm{flex:1 1 auto}.shead .c{width:28px;flex:none;text-align:center}
.shead .c.atk{color:var(--atk)}.shead .c.def{color:var(--def)}
.slot{position:relative;display:flex;align-items:center;gap:6px;height:40px;background:var(--row);border:1px solid var(--rowline);border-radius:9px;padding:0 20px 0 6px;min-width:0;-webkit-user-select:none;user-select:none}
.admin .slot{cursor:grab}
.slot .n{width:14px;text-align:center;color:var(--muted2);font-size:11px;font-weight:700;flex:none}
.slot .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.slot .tier{margin-left:auto}
.slot .fb{background:none;border:none;padding:0;flex:none;display:flex}
.slot .fb[disabled]{opacity:1;cursor:default}
.slot .x{position:absolute;top:2px;right:2px;width:16px;height:16px;padding:0;border:none;background:transparent;color:var(--danger);display:flex;align-items:center;justify-content:center}
.slot.over{outline:2px solid var(--gold);outline-offset:-1px}
.empty-slot{height:34px;border:1px dashed #353D4B;border-radius:9px;display:flex;align-items:center;gap:6px;padding:0 6px;color:#7F8896;font-size:12px}
.empty-slot .n{width:14px;text-align:center;font-weight:700;font-size:11px}
.dropzone.over{outline:2px dashed var(--gold);outline-offset:3px;border-radius:14px}
.tier{flex:none;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap;border:1px solid}
.tier.t11{background:#3A2E12;border-color:#D9A441;color:var(--gold2)}
.tier.t10{background:#12263F;border-color:#5B9BE0;color:var(--def)}
.tier.t7{background:#2A2D33;border-color:#8A9099;color:#C9CED6}
.addbtn{height:44px;border-radius:10px;border:1px solid var(--gold);background:var(--goldbg);color:var(--gold2);font-weight:700;font-size:14px}

/* pool */
.pool{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.pool h2{margin:0;font-size:18px;font-weight:900}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.phead .s{font-size:13px;color:var(--muted)}.phead .h{font-size:12px;color:var(--muted);flex-basis:100%}
.tgroup{display:flex;flex-direction:column;gap:8px}
.tghead{display:flex;align-items:center;gap:8px}
.tghead .tier{font-size:13px;font-weight:900;padding:3px 10px;border-radius:6px}
.tghead span{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pc{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;min-width:0;background:var(--row);border:1px solid var(--rowline);border-left-width:4px;-webkit-user-select:none;user-select:none}
.pc.t11{border-left-color:#D9A441}.pc.t10{border-left-color:#5B9BE0}.pc.t7{border-left-color:#8A9099}
.admin .pc.free{cursor:grab}
.pc.sel{outline:2px solid var(--gold)}
.pc.used{background:#181C23;border-color:#262C36;color:#6B7380;opacity:.7}
.pc .pn{background:none;border:none;padding:0;text-align:left;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.pc .pn[disabled]{opacity:1;cursor:default}
.pc select{height:28px;background:#11151C;color:#C3C9D2;border:1px solid #3A4250;border-radius:6px;font-size:12px}
.pc .at{font-size:12px;color:var(--muted2)}

/* menus / modals */
.veil{position:fixed;inset:0;z-index:40}
.menu{position:fixed;z-index:50;background:#1B212B;border:1px solid #3A4250;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.menu .mt{font-size:12px;color:var(--muted);padding:2px 4px 6px;font-weight:700}
.mi{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border:none;border-radius:8px;background:transparent;font-size:14px;font-weight:700;text-align:left}
.mi:hover:not([disabled]){background:#252D39}
.mi img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.mi .note{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.mi.ret{height:40px;margin-top:4px;border-top:1px solid var(--rowline);border-radius:0;color:#F2A3A3;font-size:13px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.hi{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;border:1px solid transparent;background:transparent}
.hi:hover{background:#252D39}.hi.cur{border-color:var(--gold);background:var(--goldbg)}
.hi span{font-size:11px;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:360px;background:#1B212B;border:1px solid #3A4250;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:700}
.modal input{height:42px;background:#11151C;color:var(--text);border:1px solid #3A4250;border-radius:8px;padding:0 12px;font-size:15px}
.modal input:focus{outline:none;border-color:var(--gold)}
.modal .err{color:#F2A3A3;font-size:13px;min-height:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#12161E;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:90vw;z-index:70}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.capturing .x,.capturing .pen{display:none!important}
@media (max-width:760px){.hdr{position:static}}
@media (max-width:560px){.hdr{padding:10px 12px}main{padding:14px 10px 56px}.brand h1{font-size:17px}}
/* v2 additions */
.pill.view .dot{background:var(--def)}
.monthsel{height:36px;background:#11151C;color:var(--text);border:1px solid #333B48;border-radius:8px;font-size:13px;font-weight:700;padding:0 8px}
.lbadge{flex:none;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap;border:1px solid #B07CE8;background:#2A1D3A;color:#D8B8FF}
.tier.leader{background:#2A1D3A;border-color:#B07CE8;color:#D8B8FF}
.pc.leaderc{border-left-color:#B07CE8}
.empty-slot.drop{cursor:default}
.empty-slot.over{outline:2px solid var(--gold);outline-offset:-1px}
.slot.cap{border-color:rgba(217,164,65,.55)}
.capb{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:900;padding:1px 6px 1px 4px;border-radius:4px;color:#2A1D05;background:linear-gradient(135deg,#F7D77A,#D9A441 55%,#B8862C);box-shadow:0 0 0 1px #F2C866 inset,0 1px 3px rgba(0,0,0,.4)}
.capb::after{content:"";position:absolute;top:-2px;bottom:-2px;width:14px;left:-20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:capShine 3.2s ease-in-out infinite}
.capb svg{transform-origin:2px 12px;animation:capWave 1.8s ease-in-out infinite}
@keyframes capShine{0%,62%{left:-20px}82%,100%{left:110%}}
@keyframes capWave{0%,100%{transform:rotate(0) skewY(0)}50%{transform:rotate(-5deg) skewY(-5deg)}}
.lead img,.lead .ph{animation:leadGlow 8s ease-in-out infinite}
@keyframes leadGlow{0%,100%{box-shadow:0 0 0 1px rgba(224,178,82,.25),0 0 4px 0 rgba(224,178,82,.18)}50%{box-shadow:0 0 0 2px rgba(242,200,102,.6),0 0 14px 4px rgba(224,178,82,.5)}}
@media (prefers-reduced-motion:reduce){.capb::after,.capb svg,.lead img,.lead .ph{animation:none}}
.capturing .capb::after{display:none}
.slot.partial{border-color:#C98432}
.slot .ptag,.pc .ptag{flex:none;font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px;background:#3A2812;border:1px solid #E09A3E;color:#F5C08A}
.pc.partial{border-color:#C98432!important;border-left-color:#E09A3E!important}
.pc.partial .pn{color:#F5C08A}
.pc .attn{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.pc .attn button{height:20px;padding:0 5px;border-radius:5px;border:1px solid #3A4250;background:#141922;color:var(--muted);font-size:10px;font-weight:700}
.pc .attn button.part:hover,.pc .attn button.part.on{border-color:#E09A3E;color:#F5C08A;background:#3A2812}
.pc .attn button.abs2:hover,.pc .attn button.abs2.on{border-color:#C0504D;color:#F2A3A3;background:#3A1A1A}
.undo{width:36px;padding:0;justify-content:center}
.capturing .attn{display:none!important}
.slot.absent{border-color:#C0504D}
.slot.absent .nm{color:#F2A3A3;text-decoration:line-through;text-decoration-color:#E57373;text-decoration-thickness:2px}
.slot.absent::after{content:"✕";position:absolute;left:34px;top:50%;transform:translateY(-50%);font-size:30px;font-weight:900;color:rgba(229,115,115,.45);pointer-events:none;line-height:1}
.pc{position:relative}
.pc .abs{position:absolute;top:6px;right:6px;height:20px;padding:0 6px;border-radius:5px;border:1px solid #3A4250;background:#141922;color:var(--muted);font-size:10px;font-weight:700;display:flex;align-items:center;gap:3px}
.pc .abs:hover{border-color:#C0504D;color:#F2A3A3}
.pc.absent{border-color:#C0504D!important;border-left-color:#C0504D!important}
.pc.absent .pn{color:#F2A3A3;text-decoration:line-through;text-decoration-color:#E57373;text-decoration-thickness:2px}
.pc.absent::after{content:"✕";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;font-weight:900;color:rgba(229,115,115,.35);pointer-events:none;line-height:1}
.pc.absent .abs{background:#3A1A1A;border-color:#C0504D;color:#F2A3A3}
.pc .pn{padding-right:78px}
.pc .del{position:absolute;bottom:8px;right:8px;width:22px;height:22px;border-radius:5px;border:1px solid #5A3434;background:#2A1A1A;color:#F2A3A3;display:flex;align-items:center;justify-content:center;padding:0}
.pc .mtag{font-size:10px;color:var(--muted)}
.hreset{height:24px;padding:0 8px;border-radius:6px;border:1px solid #3A4250;background:transparent;color:#C3C9D2;font-size:11px;font-weight:700;margin-left:auto}
.hreset:hover{border-color:var(--gold);color:var(--gold2)}
.jhead .cnt{margin-left:8px}
.jhead .spacer{margin-left:auto}
.lead .pbtn{background:none;border:none;padding:0;display:flex}
.lead .pbtn[disabled]{opacity:1;cursor:default}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2A313D}
.acct .aid{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.acct .arole{font-size:11px;color:var(--muted)}
.acct input{height:34px!important;font-size:13px!important;width:120px}
.modal.wide{max-width:460px}
.capturing .hreset,.capturing .abs{display:none!important}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
/* ═════════════ 설정 ═════════════ */
// Apps Script 웹 앱 URL. 비워두면 미리보기 모드(저장 안 됨, 모든 권한).
const API_URL = 'https://script.google.com/macros/s/AKfycby3fRSxTMvDpPZ-1s1e7cR8kWvaTGeKwx1s28JRh5Ul50J_kCs4ePqqbso3hdYJoDSB7w/exec';

/* ═════════════ 고정 데이터 ═════════════ */
const HEROES = ['찰스','페라','웨이론','소피아','스루드','첸코','살로','힐데','트리톤'];
const HERO_FILE = {'찰스':'charles','페라':'petra','웨이론':'weewoo','소피아':'sophia','스루드':'thrud','첸코':'chenko','살로':'saul','힐데':'hilde','트리톤':'triton'};
const HERO_EN = {'찰스':'Charles','페라':'Petra','웨이론':'Wee&Woo','소피아':'Sophia','스루드':'Thrud','첸코':'Chenko','살로':'Saul','힐데':'Hilde','트리톤':'Triton'};
const PERSON_IMG = {ckids:'img/leaders/ckids.png',taiji:'img/leaders/taiji.png',jason:'img/leaders/jason.png',eric:'img/leaders/eric.png'};
const RIDS = ['r1','r2','r3'];
const MAX = 8;

function normalize(s){
  const d=DEFAULT_STATE(); if(!s||typeof s!=='object') return d;
  if(s.v!==2){ // v1 형태가 오면 변환
    const old=['ckids','taiji','jason'], n=DEFAULT_STATE();
    (s.leaders||[]).forEach((L,li)=>{ const x={...L}; x.id=RIDS[li]; x.person=L.name||n.leaders[li].person; delete x.name; n.leaders[li]=x; });
    RIDS.forEach((rid,li)=>{ ((s.assign||{})[old[li]]||[]).forEach((e,k)=>{ if(k<MAX&&e){ n.slots[rid][k]=e.name; n.heroes[rid][k]={atk:e.atk??null,def:e.def??null}; } }); });
    n.tiers=s.tiers||{}; s=n;
  }
  s.leaders = Array.isArray(s.leaders)&&s.leaders.length===3 ? s.leaders : d.leaders;
  s.leaders.forEach((L,li)=>{ L.id=RIDS[li]; if(!L.person) L.person=d.leaders[li].person; });
  s.slots=s.slots||{}; s.heroes=s.heroes||{};
  RIDS.forEach(rid=>{ const a=(s.slots[rid]||[]).slice(0,MAX); while(a.length<MAX) a.push(null); s.slots[rid]=a.map(x=>x||null);
    const h=(s.heroes[rid]||[]).slice(0,MAX); while(h.length<MAX) h.push({atk:null,def:null}); s.heroes[rid]=h.map(x=>({atk:x&&x.atk!==undefined?x.atk:null,def:x&&x.def!==undefined?x.def:null})); });
  s.captain=s.captain||{}; s.absent=s.absent||{}; s.manual=Array.isArray(s.manual)?s.manual:[]; s.tiers=s.tiers||{}; s.v=2;
  return s;
}

function applyPayload(res){
  roster=res.roster||[]; data=normalize(res.state); rev=res.rev||0;
  if(res.months) months=res.months; if(res.records) records=res.records;
  if(!data.month) data.month=res.month||months[0]||'';
  LS.set('rally_cache2',{roster,state:data,rev,months,records});
}

async function load(){
  if(preview){ roster=PREVIEW_ROSTER; data=normalize(LS.get('rally_preview_state2',null)); if(!data.month) data.month='2026년11월'; months=[data.month]; records=[]; ui.loaded=true; render(); return; }
  const cache=LS.get('rally_cache2',null);
  if(cache){ roster=cache.roster||[]; data=normalize(cache.state); rev=cache.rev||0; months=cache.months||[]; records=cache.records||[]; ui.loaded=true; render(); }
  try{
    const res=await apiGet(); if(!res.ok) throw new Error(res.error);
    applyPayload(res); ui.loaded=true; ui.loadErr=false;
    const draft=LS.get('rally_draft2',null);
    if(draft&&logged()){ if(draft.rev===rev){ data=normalize(draft.state); render(); await doSave(true); } else LS.del('rally_draft2'); }
  }catch(e){ ui.loadErr=true; ui.loaded=true; }
  render();
  if(session&&!preview){ apiPost({action:'whoami',token:session.token}).then(r=>{ if(!r.ok){ session=null; LS.del('rally_session2'); render(); } else { session.role=r.role; session.rally=r.rally; LS.set('rally_session2',session); render(); } }).catch(()=>{}); }
}

/* 모든 변경은 act()로: 적용 → 대기열 → 자동 저장 (충돌 시 서버 최신본에 다시 적용) */
let saveTimer=null, saving=false;
/* 되돌리기/다시 실행: 내 변경만 경로 단위로 기록 → 되돌릴 때 현재 값이 내가 바꾼 값과 같을 때만 원래대로 */
const clone=o=>JSON.parse(JSON.stringify(o));
const jeq=(a,b)=>JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
function diffPaths(a,b,path,out){
  out=out||[]; path=path||[];
  const oa=a&&typeof a==='object', ob=b&&typeof b==='object';
  if(oa&&ob&&Array.isArray(a)===Array.isArray(b)&&!(Array.isArray(a)&&a.length!==b.length&&path[0]==='manual')){
    const keys=new Set(Object.keys(a).concat(Object.keys(b)));
    keys.forEach(k=>diffPaths(a[k],b[k],path.concat(k),out));
  } else if(!jeq(a,b)) out.push([path,a===undefined?null:clone(a===undefined?null:a),b===undefined?null:clone(b)]);
  return out;
}
function getP(o,p){ return p.reduce((x,k)=>x==null?undefined:x[k],o); }
function setP(o,p,v){ let x=o; for(let i=0;i<p.length-1;i++){ if(x[p[i]]==null) x[p[i]]=(typeof p[i+1]==='number'||/^\d+$/.test(p[i+1]))?[]:{}; x=x[p[i]]; } const k=p[p.length-1]; if(v===null&&!Array.isArray(x)&&(p[0]==='absent'||p[0]==='tiers'||p[0]==='captain')) delete x[k]; else x[k]=v; }
const UKEY='rally_undo2';
let hist=LS.get(UKEY,{u:[],r:[],m:''});
function saveHist(){ hist.u=hist.u.slice(-50); hist.r=hist.r.slice(-50); LS.set(UKEY,hist); }
function resetHist(){ hist={u:[],r:[],m:data.month||''}; saveHist(); }
function revertOp(changes,dir){ return st=>{ changes.forEach(([p,before,after])=>{ const from=dir==='back'?after:before, to=dir==='back'?before:after; if(jeq(getP(st,p),from)) setP(st,p,clone(to)); }); }; }
function record(before,mergeKey){
  const ch=diffPaths(before,data); if(!ch.length) return;
  const last=hist.u[hist.u.length-1], now=Date.now();
  if(mergeKey&&last&&last.k===mergeKey&&now-last.t<2000){ // 연속 입력은 한 단계로 합침
    ch.forEach(([p,,after])=>{ const e=last.c.find(x=>jeq(x[0],p)); if(e) e[2]=after; else last.c.push([p,getP(before,p)??null,after]); }); last.t=now;
  } else hist.u.push({c:ch,k:mergeKey||'',t:now});
  hist.r=[]; hist.m=data.month||''; saveHist();
}
function undoRedo(dir){
  if(ui.view||!logged()) return;
  if(hist.m&&hist.m!==data.month){ resetHist(); }
  const from=dir==='back'?hist.u:hist.r, to=dir==='back'?hist.r:hist.u;
  const e=from.pop(); if(!e){ toast(t().nothingUndo); return; }
  to.push(e); saveHist(); commit(revertOp(e.c,dir)); toast(dir==='back'?t().undone:t().redone);
}
function act(fn,mergeKey){
  if(ui.view) return;
  const before=clone(data); fn(data); record(before,mergeKey); queue(fn);
}
function commit(fn){ if(ui.view) return; fn(data); queue(fn); }
function queue(fn){
  pending.push(fn); ui.menu=null;
  if(preview){ pending=[]; LS.set('rally_preview_state2',data); render(); return; }
  LS.set('rally_draft2',{state:data,rev}); ui.saveState='busy'; render();
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(false),600);
}
async function doSave(fromDraft, tries){
  if(preview||!logged()) return; if(saving){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(fromDraft,tries),400); return; }
  tries=tries||0; saving=true; ui.saveState='busy'; renderStatus();
  const n=pending.length;
  try{
    const res=await apiPost({action:'save',token:session.token,state:data,rev});
    if(res.ok){ rev=res.rev; pending.splice(0,n); ui.saveState='ok'; if(!pending.length) LS.del('rally_draft2'); LS.set('rally_cache2',{roster,state:data,rev,months,records}); if(fromDraft) toast(t().draftRestored); }
    else if(res.error==='conflict'){
      const fns=pending.slice(); data=normalize(res.state); rev=res.rev; fns.forEach(f=>{ try{ f(data); }catch(e){} });
      saving=false; render(); if(tries<4) return doSave(fromDraft,tries+1); toast(t().conflict); return;
    }
    else if(res.error==='auth'){ session=null; LS.del('rally_session2'); ui.saveState='err'; toast(t().authExpired); openLogin(); }
    else if(res.error==='forbidden'){ pending=[]; LS.del('rally_draft2'); toast(t().forbidden); await refresh(true); }
    else throw new Error(res.error);
  }catch(e){ ui.saveState='err'; }
  saving=false; render();
  if(pending.length&&ui.saveState==='ok'){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(false),300); }
}
async function refresh(force){
  if(preview) return;
  try{ const res=await apiGet(); if(res.ok&&(force||res.rev!==rev)){ applyPayload(res); render(); } }catch(e){}
}
setInterval(()=>{ if(!preview&&!ui.view&&!drag&&!ui.menu&&!ui.modal&&!ui.editing&&!pending.length&&!saving&&document.visibilityState==='visible') refresh(false); },15000);

/* ═════════════ 편성 조작 (st = 대상 상태, 이름 기준이라 재적용 가능) ═════════════ */
function clearCaptainIfMoved(st,name,fromRid,toRid){ if(fromRid!==toRid&&st.captain[fromRid]===name) delete st.captain[fromRid]; }
const op = {
  add:(name,rid)=>st=>{ if(whereIs(name,st)) return; const i=firstEmpty(rid,st); if(i<0) return; st.slots[rid][i]=name; },
  placeAt:(name,rid,i)=>st=>{ if(whereIs(name,st)) return; const old=st.slots[rid][i]; if(old&&st.captain[rid]===old) delete st.captain[rid]; st.slots[rid][i]=name; },
  move:(name,toRid,toI)=>st=>{ const f=whereIs(name,st); if(!f) return; if(f.rid===toRid&&f.i===toI) return; const other=st.slots[toRid][toI];
    st.slots[toRid][toI]=name; st.slots[f.rid][f.i]=other||null; clearCaptainIfMoved(st,name,f.rid,toRid); if(other) clearCaptainIfMoved(st,other,toRid,f.rid); },
  moveTo:(name,toRid)=>st=>{ const f=whereIs(name,st); if(!f||f.rid===toRid) return; const i=firstEmpty(toRid,st); if(i<0) return; st.slots[toRid][i]=name; st.slots[f.rid][f.i]=null; clearCaptainIfMoved(st,name,f.rid,toRid); },
  remove:(name)=>st=>{ const f=whereIs(name,st); if(!f) return; st.slots[f.rid][f.i]=null; if(st.captain[f.rid]===name) delete st.captain[f.rid]; },
  hero:(rid,i,key,h)=>st=>{ st.heroes[rid][i][key]=h; },
  heroReset:(rid)=>st=>{ st.heroes[rid]=emptyHeroes(); },
  captain:(rid,name)=>st=>{ if(st.captain[rid]===name) delete st.captain[rid]; else if(st.slots[rid].includes(name)) st.captain[rid]=name; },
  attend:(name,kind)=>st=>{ const cur=st.absent[name]===true?'absent':st.absent[name]; if(cur===kind) delete st.absent[name]; else st.absent[name]=(kind==='absent'?true:'partial'); },
  absentReset:()=>st=>{ st.absent={}; },
  leaderField:(li,f,v)=>st=>{ st.leaders[li][f]=v; },
  leaderHero:(li,key,k,h)=>st=>{ st.leaders[li][key][k]=h; },
  leaderPerson:(li,p)=>st=>{ st.leaders[li].person=p; },
  addManual:(name,tier)=>st=>{ if(st.manual.some(m=>m.name.toLowerCase()===name.toLowerCase())) return; st.manual.push({name,tier}); },
  delManual:(name)=>st=>{ st.manual=st.manual.filter(m=>m.name!==name); const f=whereIs(name,st); if(f){ st.slots[f.rid][f.i]=null; if(st.captain[f.rid]===name) delete st.captain[f.rid]; } delete st.absent[name]; delete st.tiers[name]; },
  tier:(name,v)=>st=>{ st.tiers[name]=v; },
  resetAll:()=>st=>{ RIDS.forEach(r=>st.slots[r]=emptyRow()); st.captain={}; }
};

/* 사용자 동작 → 권한 확인 → act */
function doAdd(name,rid){
  if(!canRally(rid)) return toast(t().noPerm);
  const w=whereIs(name); if(w){ if(w.rid===rid) return; if(!isAdmin()) return toast(t().noPerm); if(firstEmpty(rid)<0) return toast(t().full); return act(op.moveTo(name,rid)); }
  if(firstEmpty(rid)<0) return toast(t().full);
  ui.selected=null; act(op.add(name,rid));
}
function doDropOnSlot(d,rid,i){
  if(d.from){ // 집결원 → 칸 (교환/이동)
    if(!(isAdmin()||(myRally()===d.from&&myRally()===rid))) return toast(t().noPerm);
    act(op.move(d.name,rid,i));
  } else { // 풀 → 칸
    if(!canRally(rid)) return toast(t().noPerm);
    act(op.placeAt(d.name,rid,i));
  }
}

  }).join('');

  const poolTools = !viewing&&logged() ? `<div class="addrow">${admin?`<button class="btn" data-act="addperson">${ICON.plus}${T_.addPerson}</button>`:''}<button class="btn" data-act="absentreset">${T_.absentReset}</button><button class="btn" data-act="attsave">${ICON.save}${T_.attSave}</button></div>` : '';

  $app.innerHTML = hdr + `<main class="${(admin&&!viewing)?'admin':''}">${banners}
    <section id="capture" class="cap"><div class="grid">${cols}</div></section>
    <section class="pool dropzone" data-zone="pool"><div class="phead"><h2>${T_.pool}</h2><span class="s">${T_.total} ${people.length}${T_.people} · ${T_.assigned} ${assignedCount}${T_.people}</span><span class="h">${(!viewing&&logged())?T_.poolHintEdit:T_.poolHintView}</span></div>${poolTools}${groups}</section>
  </main><div id="overlay"></div>`;
  renderOverlay();
  const inp=$app.querySelector('.rin[data-ratio]'); if(inp){ inp.focus(); inp.select(); }
}

function menuPos(x,y,w,h){ return {x:Math.max(8,Math.min(x||innerWidth/2,innerWidth-w-8)), y:Math.max(8,Math.min(y||innerHeight/2,innerHeight-h-8))}; }
function openMenu(kind,x,y,extra,w,h){ const p=menuPos(x,y,w||240,h||300); ui.menu=Object.assign({kind,x:p.x,y:p.y},extra); renderOverlay(); }
function openLogin(){ ui.modal='login'; renderOverlay(); }
function nextMonthName(){ const all=months.concat([data.month]).filter(Boolean).map(m=>{ const x=m.match(/(\d{4})년\s?(\d{1,2})월/); return x?(+x[1])*12+(+x[2]-1):0; }); const mx=all.length?Math.max(...all):(new Date().getFullYear()*12+new Date().getMonth()); const n=mx+1; return Math.floor(n/12)+'년'+(n%12+1)+'월'; }

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, T_=t();
  switch(a){
    case 'tab': ui.tab=v; render(); break;
    case 'lang': ui.lang=v; LS.set('rally_lang',v); render(); break;
    case 'heroes': ui.heroesOpen=!ui.heroesOpen; LS.set('rally_heroes_open',ui.heroesOpen); render(); break;
    case 'edit': if(isAdmin()){ ui.edit=!ui.edit; render(); } break;
    case 'shot': screenshot(); break;
    case 'reset': if(isAdmin()&&confirm(T_.resetConfirm)){ ui.selected=null; act(op.resetAll()); toast(T_.resetDone); } break;
    case 'login': openLogin(); break;
    case 'logout': if(session) apiPost({action:'logout',token:session.token}).catch(()=>{}); session=null; LS.del('rally_session2'); ui.edit=false; ui.selected=null; render(); toast(T_.loggedOut); break;
    case 'accounts': ui.modal='accounts'; ui.accounts=null; renderOverlay(); apiPost({action:'listAccounts',token:session.token}).then(r=>{ if(r.ok){ ui.accounts=r.accounts; renderOverlay(); } }); break;
    case 'closemodal': ui.modal=null; renderOverlay(); break;
    case 'retry': doSave(false); break;
    case 'clearsel': ui.selected=null; render(); break;
    case 'select': if(canAny()){ ui.selected = ui.selected===v?null:v; render(); } break;
    case 'add': if(ui.selected) doAdd(ui.selected,v); break;
    case 'remove': { const w=whereIs(v); if(w&&canRally(w.rid)) act(op.remove(v)); break; }
    case 'ratio': if(isAdmin()&&!ui.view){ ui.editing=v; render(); } break;
    case 'pickslot': { const [rid,i,key]=v.split(':'); if(canRally(rid)) openMenu('hero',e.clientX,e.clientY,{target:'slot',a:rid,b:+i,key},250,280); break; }
    case 'pickleader': if(isAdmin()&&ui.edit){ const [li,key,k]=v.split(':'); openMenu('hero',e.clientX,e.clientY,{target:'leader',a:+li,b:+k,key},250,250); } break;
    case 'pickperson': if(isAdmin()&&ui.edit) openMenu('person',e.clientX,e.clientY,{li:+v},240,420); break;
    case 'setperson': { const mn=ui.menu; if(mn&&isAdmin()) act(op.leaderPerson(mn.li,v)); break; }
    case 'sethero': { const mn=ui.menu; if(!mn) break; if(mn.target==='slot'){ if(canRally(mn.a)) act(op.hero(mn.a,mn.b,mn.key,v||'')); } else if(isAdmin()) act(op.leaderHero(mn.a,mn.key,mn.b,v)); break; }
    case 'moveto': { const mn=ui.menu; if(!mn) break; if(mn.kind==='pool') doAdd(mn.name,v); else if(isAdmin()){ if(firstEmpty(v)<0) toast(T_.full); else act(op.moveTo(mn.name,v)); } break; }
    case 'captain': { const mn=ui.menu; const w=mn&&whereIs(mn.name); if(w&&canRally(w.rid)) act(op.captain(w.rid,mn.name)); break; }
    case 'menureturn': { const mn=ui.menu; const w=mn&&whereIs(mn.name); if(w&&canRally(w.rid)) act(op.remove(mn.name)); break; }
    case 'closemenu': ui.menu=null; renderOverlay(); break;
    case 'heroreset': if(canRally(v)){ act(op.heroReset(v)); toast(T_.heroResetDone); } break;
    case 'attend': if(canAny()) act(op.attend(v,el.dataset.k)); break;
    case 'undo': undoRedo('back'); break;
    case 'redo': undoRedo('fwd'); break;
    case 'attsave': if(canAny()) saveAttendance(); break;
    case 'absentreset': if(canAny()&&confirm(T_.absentResetConfirm)){ act(op.absentReset()); toast(T_.absentResetDone); } break;
    case 'addperson': if(isAdmin()){ ui.modal='addperson'; renderOverlay(); } break;
    case 'delmanual': if(isAdmin()&&confirm(v+' — '+T_.delConfirm)) act(op.delManual(v)); break;
    case 'back': ui.view=null; render(); break;
    case 'restore': if(isAdmin()&&ui.view&&ui.view.hasRecord&&confirm(T_.restoreConfirm)){
        if(preview){ data=normalize(JSON.parse(JSON.stringify(ui.view.state))); data.month=ui.view.month; ui.view=null; LS.set('rally_preview_state2',data); render(); break; }
        const r=await apiPost({action:'restore',token:session.token,month:ui.view.month,rev}); if(r.ok){ roster=r.roster||roster; data=normalize(r.state); rev=r.rev; ui.view=null; pending=[]; resetHist(); render(); toast(T_.restored); } else toast(r.error); } break;
    case 'saverecord': if(isAdmin()) saveRecord(); break;
    case 'newmonth': if(isAdmin()) newMonth(); break;
  }
});
async function saveAttendance(){
  const T_=t();
  if(preview) return toast(T_.attSavePreview);
  if(pending.length||saving){ await doSave(false); }
  const r=await apiPost({action:'saveAttendance',token:session.token,month:data.month});
  if(r.ok) toast(T_.attSaved); else toast(r.error==='auth'?T_.authExpired:(r.message||r.error));
}
async function saveRecord(){
  const T_=t(), m=data.month; if(!m) return toast(T_.badMonth);
  if(records.includes(m)&&!confirm(T_.recordOverwrite)) return;
  if(preview){ records=Array.from(new Set(records.concat([m]))); LS.set('rally_rec_'+m,{state:data,savedAt:new Date().toISOString()}); render(); return toast(T_.recordSaved); }
  if(pending.length||saving){ await doSave(false); }
  const r=await apiPost({action:'saveRecord',token:session.token,month:m}); if(r.ok){ records=r.records||records; render(); toast(T_.recordSaved); } else toast(r.error);
}
async function newMonth(){
  const T_=t(); if(!confirm(T_.newMonthConfirm)) return;
  const name=(prompt(T_.newMonthPrompt,nextMonthName())||'').replace(/\s/g,''); if(!name) return;
  if(!/^\d{4}년\d{1,2}월$/.test(name)) return toast(T_.badMonth);
  if(preview){ data.month=name; months=[name].concat(months); act(op.resetAll()); act(st=>{st.absent={};st.manual=[];st.tiers={};RIDS.forEach(r=>st.heroes[r]=emptyHeroes());}); return toast(T_.newMonthDone); }
  if(pending.length||saving){ await doSave(false); }
  const r=await apiPost({action:'newMonth',token:session.token,month:name});
  if(r.ok){ roster=r.roster||[]; data=normalize(r.state); rev=r.rev; months=r.months||months; pending=[]; resetHist(); render(); toast(T_.newMonthDone); }
  else toast(r.error==='exists'?T_.monthExists:r.error==='bad_month'?T_.badMonth:r.error);
}
async function viewMonth(m){
  if(m===data.month){ ui.view=null; render(); return; }
  let rec=null, rost=PREVIEW_ROSTER, savedAt=null;
  if(preview){ const x=LS.get('rally_rec_'+m,null); if(x){ rec=x.state; savedAt=x.savedAt; } }
  else { try{ const r=await apiGet({action:'record',month:m}); if(!r.ok) throw 0; rec=r.state; rost=r.roster||[]; savedAt=r.savedAt; }catch(e){ toast(t().loadErr); render(); return; } }
  const st = rec ? normalize(rec) : Object.assign(DEFAULT_STATE(),{leaders:JSON.parse(JSON.stringify(data.leaders))});
  st.month=m; ui.view={month:m,state:st,roster:rost,savedAt,hasRecord:!!rec}; ui.selected=null; ui.edit=false; render();
}
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-tier]'); if(s&&isAdmin()&&!ui.view){ act(op.tier(s.dataset.tier,s.value)); return; }
  const m=e.target.closest('select[data-month]'); if(m){ viewMonth(m.value); }

document.addEventListener('input',e=>{
  const g=e.target.closest('input[data-gtext]'); if(g&&isAdmin()&&!ui.view){ const [li,f]=g.dataset.gtext.split(':'); const before=clone(data); data.leaders[+li][f]=g.value; const val=g.value; record(before,'g:'+li+':'+f);
    pending.push(st=>{ st.leaders[+li][f]=val; }); if(preview){ pending=[]; LS.set('rally_preview_state2',data); return; }
    LS.set('rally_draft2',{state:data,rev}); clearTimeout(saveTimer); ui.saveState='busy'; renderStatus(); saveTimer=setTimeout(()=>doSave(false),900); }
});
function commitRatio(inp){ const [li,f]=inp.dataset.ratio.split(':'); const val=inp.value.trim(); ui.editing=null; if(data.leaders[+li][f]!==val) act(op.leaderField(+li,f,val)); else render(); }
document.addEventListener('keydown',e=>{
  const inField=e.target.closest&&e.target.closest('input,textarea,select');
  if(!inField&&(e.ctrlKey||e.metaKey)&&!e.altKey){ const k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){ e.preventDefault(); undoRedo('back'); return; }
    if(k==='y'||(k==='z'&&e.shiftKey)){ e.preventDefault(); undoRedo('fwd'); return; } }
  const r=e.target.closest&&e.target.closest('input[data-ratio]');
  if(r&&e.key==='Enter'){ e.preventDefault(); commitRatio(r); }
  else if(r&&e.key==='Escape'){ ui.editing=null; render(); }
  else if(e.key==='Escape'&&(ui.menu||ui.modal)){ ui.menu=null; ui.modal=null; renderOverlay(); }
});
document.addEventListener('focusout',e=>{ const r=e.target.closest&&e.target.closest('input[data-ratio]'); if(r&&ui.editing) commitRatio(r); });

/* 우클릭 / 길게 누르기 */
function menuFor(target,x,y){
  const sl=target.closest('.slot[data-slot]'), pc=target.closest('.pc.free[data-pool]');
  if(sl){ openMenu('slot',x,y,{name:sl.dataset.name},240,320); return true; }
  if(pc){ openMenu('pool',x,y,{name:pc.dataset.pool},240,240); return true; }
  return false;
}
document.addEventListener('contextmenu',e=>{
  if(ui.menu){ e.preventDefault(); ui.menu=null; renderOverlay(); return; }
  if(ui.view||!logged()) return;
  if(e.target.closest('.slot[data-slot],.pc.free[data-pool]')){ e.preventDefault(); menuFor(e.target,e.clientX,e.clientY); }
});
let lpTimer=null, lpStart=null;
document.addEventListener('touchstart',e=>{
  if(ui.view||!logged()) return; const tgt=e.target.closest('.slot[data-slot],.pc.free[data-pool]'); if(!tgt) return;
  if(e.target.closest('button,select,input')&&!e.target.closest('.pn')) return;
  const tch=e.touches[0]; lpStart={x:tch.clientX,y:tch.clientY};
  lpTimer=setTimeout(()=>{ lpTimer=null; menuFor(tgt,lpStart.x,lpStart.y); if(navigator.vibrate) navigator.vibrate(15); },500);
},{passive:true});
['touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>{ clearTimeout(lpTimer); lpTimer=null; },{passive:true}));
document.addEventListener('touchmove',e=>{ if(!lpTimer||!lpStart) return; const tch=e.touches[0]; if(Math.abs(tch.clientX-lpStart.x)>10||Math.abs(tch.clientY-lpStart.y)>10){ clearTimeout(lpTimer); lpTimer=null; } },{passive:true});

/* 드래그 앤 드롭 */
document.addEventListener('dragstart',e=>{
  if(ui.view||!logged()) return;
  const sl=e.target.closest('.slot[data-slot]'), pc=e.target.closest('.pc.free[data-pool]');
  if(sl){ const [rid,i]=sl.dataset.slot.split(':'); drag={name:sl.dataset.name,from:rid,idx:+i}; }
  else if(pc){ drag={name:pc.dataset.pool,from:null,idx:-1}; }
  else return;
  try{ e.dataTransfer.setData('text/plain',drag.name); e.dataTransfer.effectAllowed='move'; }catch(err){}
});
document.addEventListener('dragend',()=>{ drag=null; document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); });
document.addEventListener('dragover',e=>{
  if(!drag) return; const z=e.target.closest('[data-slot],[data-zone]'); if(!z) return;
  e.preventDefault(); document.querySelectorAll('.over').forEach(x=>{ if(x!==z) x.classList.remove('over'); }); z.classList.add('over');
});
document.addEventListener('drop',e=>{
  if(!drag) return; const d=drag; drag=null; document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  const sl=e.target.closest('[data-slot]'), z=e.target.closest('[data-zone]');
  if(sl){ e.preventDefault(); const [rid,i]=sl.dataset.slot.split(':'); doDropOnSlot(d,rid,+i); return; }
  if(z){ e.preventDefault();
    if(z.dataset.zone==='pool'){ if(d.from){ if(canRally(d.from)) act(op.remove(d.name)); else toast(t().noPerm); } return; }
    const rid=z.dataset.zone;
    if(!d.from) return doAdd(d.name,rid);
    if(d.from===rid) return;
    if(!isAdmin()) return toast(t().noPerm);
    if(firstEmpty(rid)<0) return toast(t().full);
    act(op.moveTo(d.name,rid));
  }
});

/* 폼 */
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target, err=document.getElementById('formErr'), T_=t(); const btn=f.querySelector('[type=submit]'); if(btn) btn.disabled=true;
  try{
    if(f.id==='loginForm'){
      const id=f.uid.value.trim().toLowerCase(); LS.set('rally_last_id',id);
      const r=await apiPost({action:'login',id,password:f.password.value});
      if(r.ok){ session={token:r.token,id:r.id,role:r.role,rally:r.rally,exp:r.exp}; LS.set('rally_session2',session); ui.modal=null; render(); toast(T_.loggedIn); const draft=LS.get('rally_draft2',null); if(draft&&draft.rev===rev){ data=normalize(draft.state); doSave(true); } }
      else err.textContent = r.error==='locked'?T_.locked:T_.loginErr;
    } else if(f.id==='addForm'){
      const name=f.pname.value.trim(), tier=f.ptier.value; if(!name) return;
      if(allPeople().some(p=>p.name.toLowerCase()===name.toLowerCase())){ err.textContent=T_.dup; return; }
      ui.modal=null; act(op.addManual(name,tier));
    } else if(f.dataset.acct){
      const np=f.np.value; if(np.length<4){ document.getElementById('formErr').textContent=T_.pwWeak; return; }
      const r=await apiPost({action:'setPassword',token:session.token,target:f.dataset.acct,newPassword:np});
      if(r.ok){ f.np.value=''; toast(f.dataset.acct+' — '+T_.pwDone); } else document.getElementById('formErr').textContent=r.error;
    }
  }catch(ex){ if(err) err.textContent=String(ex.message||ex); }
  finally{ if(btn) btn.disabled=false; }
});

/* 스크린샷: 집결장 3열 영역만 */
async function screenshot(){
  const el=document.getElementById('capture'); if(!el||!window.html2canvas){ toast(t().shotErr); return; }
  document.body.classList.add('capturing');
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#0F131A',scale:2,useCORS:true});
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    const fname=`rally-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`;
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const file=new File([blob],fname,{type:'image/png'});
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:t().title}); return; }catch(err){ if(err&&err.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    toast(t().shotDone);
  }catch(err){ toast(t().shotErr); }
  finally{ document.body.classList.remove('capturing'); }
}

load();
</script>
</body>
</html>
