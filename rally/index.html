<style>
:root{
  --bg:#0F131A;--panel:#141922;--card:#171C25;--line:#2A313D;--line2:#262D39;--row:#1F2530;--rowline:#2E3644;
  --text:#E8EAEE;--muted:#9AA3AF;--muted2:#8E97A5;--gold:#E0B252;--gold2:#F2C866;--goldbg:#2B2412;
  --atk:#F0B8A0;--atkring:#C9826A;--def:#9CC7F5;--defring:#5B9BE0;--danger:#E57373;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.35}
input,select{font-family:inherit}
img{display:block}
a{color:var(--gold)}a:hover{color:var(--gold2)}

/* header */
.hdr{background:var(--panel);border-bottom:1px solid var(--line2);padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--gold)}
.brand h1{margin:0;font-size:19px;font-weight:900}
.brand .sub{font-size:12px;color:var(--muted)}
.brand .sub a{color:var(--muted);text-decoration:none;margin-left:8px}.brand .sub a:hover{color:var(--gold2)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:4px}
.tab{height:32px;padding:0 14px;border-radius:7px;border:none;font-size:13px;font-weight:700;background:transparent;color:#C3C9D2}
.tab.on{background:var(--gold);color:#1A1406}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid #333B48;background:transparent;color:#C3C9D2;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4A5363}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1A1406}
.btn.active{background:var(--goldbg);border-color:var(--gold);color:var(--gold2)}
.btn.danger{color:#F2A3A3;border-color:#5A3434}
.seg{display:flex;border:1px solid #333B48;border-radius:8px;overflow:hidden}
.seg button{height:34px;width:40px;border:none;font-size:12px;font-weight:700;background:transparent;color:#C3C9D2}
.seg button.on{background:var(--text);color:#12161E}
.pill{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#5C6573}
.pill.ok .dot{background:#6FCF8A}.pill.busy .dot{background:var(--gold)}.pill.err .dot{background:var(--danger)}
.admin-chip{font-size:12px;color:var(--gold2);background:var(--goldbg);border:1px solid #5A4A22;border-radius:999px;padding:3px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{max-width:1400px;margin:0 auto;padding:20px 20px 64px;display:flex;flex-direction:column;gap:26px}
.banner{background:var(--goldbg);border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.banner.warn{background:#2A1A1A;border-color:#7A3A3A;color:#F2A3A3}

/* leaders */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.cap{background:var(--bg);padding:2px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lead{display:flex;align-items:center;gap:12px}
.lead img,.lead .ph{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
.lead .ph{display:flex;align-items:center;justify-content:center;background:#232A36;border-style:dashed;border-color:#4A5363;font-size:20px;font-weight:900;color:#C3C9D2}
.role{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.role.main{background:#3A2E12;color:var(--gold2)}.role.sub{background:#1D2D40;color:var(--def)}
.lname{font-size:21px;font-weight:900;line-height:1.1}
.hbox{border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:10px}
.hbox.atk{background:#1E1A14;border:1px solid #3B3224}.hbox.def{background:#141B22;border:1px solid #243444}
.hbox .meta{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
.hlabel{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.atk .hlabel{color:var(--atk)}.def .hlabel{color:var(--def)}
.faces{display:flex;gap:6px;flex:none}
.fbtn{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:46px}
.fbtn span{font-size:10px;color:#C3C9D2;white-space:nowrap;max-width:46px;overflow:hidden;text-overflow:ellipsis}
.fbtn[disabled]{opacity:1;cursor:default}
.face{border-radius:50%;flex:none;object-fit:cover;object-position:center;background:#2A303B;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.face.atk{border-color:var(--atkring)}.face.def{border-color:var(--defring)}
.face.empty{background:transparent;border-style:dashed;color:#7F8896}

.ratio{background:none;border:none;padding:1px 4px;margin-left:-4px;border-radius:5px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none;cursor:default}
.ratio .k{color:var(--muted)}
.ratio .pen{opacity:0;transition:opacity .12s}
.admin .ratio{cursor:pointer}
.admin .ratio:hover{background:rgba(224,178,82,.12)}
.admin .ratio:hover .pen,.admin .ratio:focus-visible .pen{opacity:1}
@media (hover:none){.admin .ratio .pen{opacity:.6}}
.rin{height:26px;background:#11151C;color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:0 6px;font-size:12px}

.jhead{display:flex;align-items:baseline;gap:8px}
.jhead b{font-size:14px;font-weight:900}.jhead span{font-size:12px;color:var(--muted)}
.cnt{margin-left:auto;font-size:16px;font-weight:900}
.cnt.full{color:#F2A3A3}.cnt.good{color:#8FD19E}
.guide{background:#12161D;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.guide .gt{font-size:11px;font-weight:700;color:var(--muted)}
.grow{display:flex;align-items:center;gap:8px;min-height:28px}
.badge{border-radius:4px;padding:2px 7px;font-weight:700;font-size:11px;flex:none}
.badge.atk{background:#3B2A22;color:var(--atk)}.badge.def{background:#1D2D40;color:var(--def)}
.gfaces{display:flex;gap:4px;margin-left:auto}
.gtext{flex:1 1 100px;min-width:0}

.slots{display:flex;flex-direction:column;gap:5px}
.shead{display:flex;align-items:center;gap:6px;padding:0 20px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
.shead .n{width:14px;flex:none}.shead .nm{flex:1 1 auto}.shead .c{width:28px;flex:none;text-align:center}
.shead .c.atk{color:var(--atk)}.shead .c.def{color:var(--def)}
.slot{position:relative;display:flex;align-items:center;gap:6px;height:40px;background:var(--row);border:1px solid var(--rowline);border-radius:9px;padding:0 20px 0 6px;min-width:0;-webkit-user-select:none;user-select:none}
.admin .slot{cursor:grab}
.slot .n{width:14px;text-align:center;color:var(--muted2);font-size:11px;font-weight:700;flex:none}
.slot .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.slot .fb{background:none;border:none;padding:0;flex:none;display:flex}
.slot .fb[disabled]{opacity:1;cursor:default}
.slot .x{position:absolute;top:2px;right:2px;width:16px;height:16px;padding:0;border:none;background:transparent;color:var(--danger);display:flex;align-items:center;justify-content:center}
.slot.over{outline:2px solid var(--gold);outline-offset:-1px}
.empty-slot{height:34px;border:1px dashed #353D4B;border-radius:9px;display:flex;align-items:center;gap:6px;padding:0 6px;color:#7F8896;font-size:12px}
.empty-slot .n{width:14px;text-align:center;font-weight:700;font-size:11px}
.dropzone.over{outline:2px dashed var(--gold);outline-offset:3px;border-radius:14px}

.tghead{display:flex;align-items:center;gap:8px}
.tghead .tier{font-size:13px;font-weight:900;padding:3px 10px;border-radius:6px}
.tghead span{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pc{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;min-width:0;background:var(--row);border:1px solid var(--rowline);border-left-width:4px;-webkit-user-select:none;user-select:none}

.pc.sel{outline:2px solid var(--gold)}
.pc.used{background:#181C23;border-color:#262C36;color:#6B7380;opacity:.7}
.pc .pn{background:none;border:none;padding:0;text-align:left;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.pc .pn[disabled]{opacity:1;cursor:default}
.pc select{height:28px;background:#11151C;color:#C3C9D2;border:1px solid #3A4250;border-radius:6px;font-size:12px}
.pc .at{font-size:12px;color:var(--muted2)}

.veil{position:fixed;inset:0;z-index:40}
.menu{position:fixed;z-index:50;background:#1B212B;border:1px solid #3A4250;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 32px rgba(0,0,0,.55)}

.mi{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border:none;border-radius:8px;background:transparent;font-size:14px;font-weight:700;text-align:left}

.mi img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.mi .note{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.mi.ret{height:40px;margin-top:4px;border-top:1px solid var(--rowline);border-radius:0;color:#F2A3A3;font-size:13px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.hi{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;border:1px solid transparent;background:transparent}
.hi:hover{background:#252D39}.hi.cur{border-color:var(--gold);background:var(--goldbg)}
.hi span{font-size:11px;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:360px;background:#1B212B;border:1px solid #3A4250;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:700}
.modal input{height:42px;background:#11151C;color:var(--text);border:1px solid #3A4250;border-radius:8px;padding:0 12px;font-size:15px}
.modal input:focus{outline:none;border-color:var(--gold)}
.modal .err{color:#F2A3A3;font-size:13px;min-height:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#12161E;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:90vw;z-index:70}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.capturing .x,.capturing .pen{display:none!important}
@media (max-width:760px){.hdr{position:static}}
@media (max-width:560px){.hdr{padding:10px 12px}main{padding:14px 10px 56px}.brand h1{font-size:17px}}
</style>

/* ═════════════ 서버 ═════════════ */
async function apiGet(){const r=await fetch(API_URL+'?action=state&_='+Date.now());return r.json()}
async function apiPost(body){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});return r.json()}

function normalize(s){
  const d=DEFAULT_STATE(); if(!s||typeof s!=='object') return d;
  s.leaders = Array.isArray(s.leaders)&&s.leaders.length ? s.leaders : d.leaders;
  s.assign = s.assign||{}; s.leaders.forEach(L=>{ if(!Array.isArray(s.assign[L.id])) s.assign[L.id]=[]; });
  s.tiers = s.tiers||{}; return s;
}

async function load(){
  const cache=LS.get('rally_cache',null);
  if(preview){
    roster=PREVIEW_ROSTER; data=normalize(LS.get('rally_preview_state',null)); ui.loaded=true; render(); return;
  }
  if(cache){ roster=cache.roster||[]; data=normalize(cache.state); rev=cache.rev||0; ui.loaded=true; render(); }
  try{
    const res=await apiGet();
    if(!res.ok) throw new Error(res.error);
    roster=res.roster||[]; data=normalize(res.state); rev=res.rev||0; ui.loaded=true; ui.loadErr=false;
    LS.set('rally_cache',{roster,state:data,rev});
    // 저장 못 했던 변경(임시저장)이 있으면 다시 저장
    const draft=LS.get('rally_draft',null);
    if(draft && isAdmin()){
      if(draft.rev===rev){ data=normalize(draft.state); render(); await doSave(true); }
      else LS.del('rally_draft');
    }
  }catch(e){ ui.loadErr=true; ui.loaded=true; }
  render();
  if(session&&!preview){ apiPost({action:'whoami',token:session.token}).then(r=>{ if(!r.ok){ session=null; LS.del('rally_session'); render(); } }).catch(()=>{}); }
}

let saveTimer=null;
function changed(){
  if(preview){ LS.set('rally_preview_state',data); render(); return; }
  LS.set('rally_draft',{state:data,rev}); // 서버 저장 전까지 브라우저에 임시저장
  ui.saveState='busy'; render();
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(false),700);
}
async function doSave(fromDraft){
  if(preview||!isAdmin()) return;
  ui.saveState='busy'; renderStatus();
  try{
    const res=await apiPost({action:'save',token:session.token,state:data,rev});
    if(res.ok){ rev=res.rev; ui.saveState='ok'; LS.del('rally_draft'); LS.set('rally_cache',{roster,state:data,rev}); if(fromDraft) toast(t().draftRestored); }
    else if(res.error==='conflict'){ data=normalize(res.state); rev=res.rev; LS.del('rally_draft'); ui.saveState='ok'; toast(t().conflict); }
    else if(res.error==='auth'){ session=null; LS.del('rally_session'); ui.saveState='err'; toast(t().authExpired); openLogin(); }
    else throw new Error(res.error);
  }catch(e){ ui.saveState='err'; }
  render();
}

function place(name,from,fromIdx,lid,idx){
  const a=data.assign;
  if(from!==lid && a[lid].length>=MAX){ toast(t().full); return; }
  let entry={name,atk:null,def:null};
  if(from){ entry=a[from][fromIdx]; if(!entry||entry.name!==name) return; a[from].splice(fromIdx,1); if(from===lid&&idx!=null&&idx>fromIdx) idx--; }
  else if(Object.values(a).some(arr=>arr.some(m=>m.name===name))) return;
  if(idx==null||idx>a[lid].length) idx=a[lid].length;
  a[lid].splice(idx,0,entry); ui.selected=null; ui.menu=null; changed();
}
function removeAt(lid,i){ data.assign[lid].splice(i,1); ui.menu=null; changed(); }
function setSlotHero(lid,i,key,h){ data.assign[lid][i][key]=h; ui.menu=null; changed(); }
function setLeaderHero(li,key,k,h){ data.leaders[li][key][k]=h; ui.menu=null; changed(); }
function slotHero(L,i,m,key){ const g=heroList(key==='atk'?L.gAtkText:L.gDefText); return m[key]==null ? (i<4?(g[i]||''):'') : m[key]; }

      <button class="btn primary" data-act="shot">${ICON.cam}${T_.shot}</button>
      ${admin?`<button class="btn" data-act="reset">${T_.reset}</button>`:''}

    if(mn.kind==='move'){
      h+=`<span class="mt">${esc(mn.name)} · ${T_.moveTo}</span>`;
      data.leaders.forEach(L=>{ const c=data.assign[L.id].length, cur=mn.from===L.id, full=c>=MAX;
        h+=`<button class="mi" role="menuitem" data-act="moveto" data-v="${L.id}" ${cur||full?'disabled':''}>${LEADER_IMG[L.id]?`<img src="${LEADER_IMG[L.id]}" alt="">`:''}<span>${esc(L.name)}</span><span class="note">${cur?T_.current:full?T_.fullNote:c+' / '+MAX}</span></button>`; });
      if(mn.from) h+=`<button class="mi ret" role="menuitem" data-act="menureturn">${T_.backToPool}</button>`;
    } else {
      let cur='', title='';
      if(mn.target==='slot'){ const L=data.leaders.find(x=>x.id===mn.a), m=data.assign[mn.a][mn.b]; title=(m?m.name+' · ':'')+(mn.key==='atk'?T_.pickAtk:T_.pickDef); cur=m?slotHero(L,mn.b,m,mn.key):''; }
      else { title=data.leaders[mn.a].name+' · '+(mn.key==='atk'?T_.attackLeader:T_.defenseLeader); cur=data.leaders[mn.a][mn.key][mn.b]; }
      h+=`<span class="mt">${esc(title)}</span><div class="hgrid">`;
      (mn.target==='slot'?HEROES.concat(['']):HEROES).forEach(x=>{ h+=`<button class="hi ${x===cur?'cur':''}" role="menuitem" data-act="sethero" data-v="${esc(x)}">${face(x,36,mn.key)}<span>${x?esc(hn(x)):T_.unset}</span></button>`; });
      h+='</div>';
    }
    h+='</div>';
  }
  if(ui.modal==='login') h+=`<div class="modal-bg"><form class="modal" id="loginForm"><h3>${T_.login}</h3>
    <label>${T_.email}<input name="email" type="email" autocomplete="username" required value="${esc(LS.get('rally_last_email',''))}"></label>
    <label>${T_.password}<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="formErr"></div><div class="row"><button type="button" class="btn" data-act="closemodal">${T_.cancel}</button><button type="submit" class="btn primary">${T_.doLogin}</button></div></form></div>`;
  if(ui.modal==='pw') h+=`<div class="modal-bg"><form class="modal" id="pwForm"><h3>${T_.pw}</h3>
    <label>${T_.oldPw}<input name="old" type="password" autocomplete="current-password" required></label>
    <label>${T_.newPw}<input name="n1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>${T_.newPw2}<input name="n2" type="password" autocomplete="new-password" minlength="8" required></label>
    <div class="err" id="formErr"></div><div class="row"><button type="button" class="btn" data-act="closemodal">${T_.cancel}</button><button type="submit" class="btn primary">${T_.change}</button></div></form></div>`;
  if(ui.toast) h+=`<div class="toast" role="status">${esc(ui.toast)}</div>`;
  ov.innerHTML=h;
  const f=ov.querySelector('form input:not([value=""])+*')||ov.querySelector('form input');
  if(ui.modal&&!ov.dataset.focused){ const first=[...ov.querySelectorAll('form input')].find(i=>!i.value); if(first) first.focus(); ov.dataset.focused='1'; }
  if(!ui.modal) delete ov.dataset.focused;
}

/* ═════════════ 메뉴 위치 ═════════════ */
function menuPos(x,y,w,h){ return {x:Math.max(8,Math.min(x||innerWidth/2,innerWidth-w-8)), y:Math.max(8,Math.min(y||innerHeight/2,innerHeight-h-8))}; }
function openMove(x,y,name,from,idx){ const p=menuPos(x,y,230,240); ui.menu={kind:'move',name,from,idx,x:p.x,y:p.y}; renderOverlay(); }
function openLogin(){ ui.modal='login'; renderOverlay(); }

/* ═════════════ 이벤트 ═════════════ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v, admin=isAdmin();
  switch(act){
    case 'tab': ui.tab=v; render(); break;
    case 'lang': ui.lang=v; LS.set('rally_lang',v); render(); break;
    case 'heroes': ui.heroesOpen=!ui.heroesOpen; LS.set('rally_heroes_open',ui.heroesOpen); render(); break;
    case 'edit': if(admin){ ui.edit=!ui.edit; render(); } break;
    case 'shot': screenshot(); break;
    case 'reset': if(admin&&confirm(t().resetConfirm)){ data.leaders.forEach(L=>data.assign[L.id]=[]); ui.selected=null; changed(); toast(t().resetDone); } break;
    case 'login': openLogin(); break;
    case 'logout': if(session) apiPost({action:'logout',token:session.token}).catch(()=>{}); session=null; LS.del('rally_session'); ui.edit=false; ui.selected=null; render(); toast(t().loggedOut); break;
    case 'pw': ui.modal='pw'; renderOverlay(); break;
    case 'closemodal': ui.modal=null; renderOverlay(); break;
    case 'retry': doSave(false); break;
    case 'clearsel': ui.selected=null; render(); break;
    case 'select': if(admin){ ui.selected = ui.selected===v?null:v; render(); } break;
    case 'add': if(admin&&ui.selected) place(ui.selected,null,-1,v,null); break;
    case 'remove': if(admin){ const [lid,i]=v.split(':'); removeAt(lid,+i); } break;
    case 'ratio': if(admin){ ui.editing=v; render(); } break;
    case 'pickslot': if(admin){ const [lid,i,key]=v.split(':'); const p=menuPos(e.clientX,e.clientY,250,270); ui.menu={kind:'hero',target:'slot',a:lid,b:+i,key,x:p.x,y:p.y}; renderOverlay(); } break;
    case 'pickleader': if(admin&&ui.edit){ const [li,key,k]=v.split(':'); const p=menuPos(e.clientX,e.clientY,250,250); ui.menu={kind:'hero',target:'leader',a:+li,b:+k,key,x:p.x,y:p.y}; renderOverlay(); } break;
    case 'sethero': { const mn=ui.menu; if(!mn) break; if(mn.target==='slot') setSlotHero(mn.a,mn.b,mn.key,v||''); else setLeaderHero(mn.a,mn.key,mn.b,v); break; }
    case 'moveto': { const mn=ui.menu; if(mn) place(mn.name,mn.from,mn.idx,v,null); break; }
    case 'menureturn': { const mn=ui.menu; if(mn&&mn.from) removeAt(mn.from,mn.idx); break; }
    case 'closemenu': ui.menu=null; renderOverlay(); break;
  }
});
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-tier]'); if(s&&isAdmin()){ data.tiers[s.dataset.tier]=s.value; changed(); }
});
document.addEventListener('input',e=>{
  const g=e.target.closest('input[data-gtext]'); if(g&&isAdmin()){ const [li,f]=g.dataset.gtext.split(':'); data.leaders[+li][f]=g.value; LS.set('rally_draft',{state:data,rev}); clearTimeout(saveTimer); ui.saveState='busy'; renderStatus(); saveTimer=setTimeout(()=>doSave(false),900); }
});
function commitRatio(inp){ const [li,f]=inp.dataset.ratio.split(':'); const val=inp.value.trim(); ui.editing=null; if(data.leaders[+li][f]!==val){ data.leaders[+li][f]=val; changed(); } else render(); }
document.addEventListener('keydown',e=>{
  const r=e.target.closest&&e.target.closest('input[data-ratio]');
  if(r&&(e.key==='Enter')){ e.preventDefault(); commitRatio(r); }
  else if(r&&e.key==='Escape'){ ui.editing=null; render(); }
  else if(e.key==='Escape'&&(ui.menu||ui.modal)){ ui.menu=null; ui.modal=null; renderOverlay(); }
});
document.addEventListener('focusout',e=>{ const r=e.target.closest&&e.target.closest('input[data-ratio]'); if(r&&ui.editing) commitRatio(r); });

/* 우클릭 / 길게 누르기 */
document.addEventListener('contextmenu',e=>{
  if(ui.menu){ e.preventDefault(); ui.menu=null; renderOverlay(); return; }
  if(!isAdmin()) return;
  const sl=e.target.closest('[data-slot]'), pc=e.target.closest('.pc.free[data-pool]');
  if(sl){ e.preventDefault(); const [lid,i]=sl.dataset.slot.split(':'); openMove(e.clientX,e.clientY,data.assign[lid][+i].name,lid,+i); }
  else if(pc){ e.preventDefault(); openMove(e.clientX,e.clientY,pc.dataset.pool,null,-1); }
});
let lpTimer=null, lpStart=null;
document.addEventListener('touchstart',e=>{
  if(!isAdmin()) return; const tgt=e.target.closest('[data-slot],.pc.free[data-pool]'); if(!tgt||e.target.closest('button,select,input')&&!e.target.closest('.pn')) return;
  const tch=e.touches[0]; lpStart={x:tch.clientX,y:tch.clientY};
  lpTimer=setTimeout(()=>{ lpTimer=null;
    if(tgt.dataset.slot){ const [lid,i]=tgt.dataset.slot.split(':'); openMove(lpStart.x,lpStart.y,data.assign[lid][+i].name,lid,+i); }
    else openMove(lpStart.x,lpStart.y,tgt.dataset.pool,null,-1);
    if(navigator.vibrate) navigator.vibrate(15);
  },500);
},{passive:true});
['touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>{ clearTimeout(lpTimer); lpTimer=null; },{passive:true}));
document.addEventListener('touchmove',e=>{ if(!lpTimer||!lpStart) return; const tch=e.touches[0]; if(Math.abs(tch.clientX-lpStart.x)>10||Math.abs(tch.clientY-lpStart.y)>10){ clearTimeout(lpTimer); lpTimer=null; } },{passive:true});

/* 드래그 앤 드롭 */
document.addEventListener('dragstart',e=>{
  if(!isAdmin()) return;
  const sl=e.target.closest('[data-slot]'), pc=e.target.closest('.pc.free[data-pool]');
  if(sl){ const [lid,i]=sl.dataset.slot.split(':'); drag={name:data.assign[lid][+i].name,from:lid,idx:+i}; }
  else if(pc){ drag={name:pc.dataset.pool,from:null,idx:-1}; }
  else return;
  try{ e.dataTransfer.setData('text/plain',drag.name); e.dataTransfer.effectAllowed='move'; }catch(err){}
});
document.addEventListener('dragend',()=>{ drag=null; document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); });
document.addEventListener('dragover',e=>{
  if(!drag) return; const z=e.target.closest('[data-zone],[data-slot]'); if(!z) return;
  e.preventDefault(); document.querySelectorAll('.over').forEach(x=>{ if(x!==z) x.classList.remove('over'); }); z.classList.add('over');
});
document.addEventListener('drop',e=>{
  if(!drag) return; const d=drag; drag=null; document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  const sl=e.target.closest('[data-slot]'), z=e.target.closest('[data-zone]');
  if(sl){ e.preventDefault(); const [lid,i]=sl.dataset.slot.split(':'); place(d.name,d.from,d.idx,lid,+i); }
  else if(z){ e.preventDefault(); if(z.dataset.zone==='pool'){ if(d.from) removeAt(d.from,d.idx); } else place(d.name,d.from,d.idx,z.dataset.zone,null); }
});

/* 로그인 / 비밀번호 변경 */
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target, err=document.getElementById('formErr'), T_=t(); const btn=f.querySelector('[type=submit]'); btn.disabled=true;
  try{
    if(f.id==='loginForm'){
      const email=f.email.value.trim().toLowerCase(); LS.set('rally_last_email',email);
      const r=await apiPost({action:'login',email,password:f.password.value});
      if(r.ok){ session={token:r.token,email:r.email,exp:r.exp}; LS.set('rally_session',session); ui.modal=null; render(); toast(T_.loggedIn); const draft=LS.get('rally_draft',null); if(draft&&draft.rev===rev){ data=normalize(draft.state); doSave(true); } }
      else err.textContent = r.error==='locked'?T_.locked:T_.loginErr;
    } else if(f.id==='pwForm'){
      if(f.n1.value!==f.n2.value){ err.textContent=T_.pwMismatch; return; }
      if(f.n1.value.length<8){ err.textContent=T_.pwWeak; return; }
      const r=await apiPost({action:'changePassword',token:session.token,oldPassword:f.old.value,newPassword:f.n1.value});
      if(r.ok){ session={token:r.token,email:r.email,exp:r.exp}; LS.set('rally_session',session); ui.modal=null; render(); toast(T_.pwDone); }
      else err.textContent = r.error==='invalid_old'?T_.pwOldWrong:r.error==='weak'?T_.pwWeak:r.error==='auth'?T_.authExpired:(r.message||r.error);
    }
  }catch(ex){ err.textContent=String(ex.message||ex); }
  finally{ btn.disabled=false; }
});

/* 스크린샷: 집결장 3열 영역만 */
async function screenshot(){
  const el=document.getElementById('capture'); if(!el||!window.html2canvas){ toast(t().shotErr); return; }
  document.body.classList.add('capturing');
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#0F131A',scale:2,useCORS:true});
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    const fname=`rally-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`;
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const file=new File([blob],fname,{type:'image/png'});
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:t().title}); return; }catch(err){ if(err&&err.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    toast(t().shotDone);
  }catch(err){ toast(t().shotErr); }
  finally{ document.body.classList.remove('capturing'); }
}

load();
