<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>킹샷 이벤트 과금효율 계산기</title>
<meta name="description" content="Kingshot 이벤트 상점 · 패키지 효율 계산기">
<style>
  :root{
    --bg1:#fff7e9; --bg2:#ffe9cf; --card:#fffdf8; --ink:#4a3b2a;
    --sub:#a08b6f; --line:#efe1c9; --gold:#f4b93b; --gold2:#e79a1e;
    --hot:#ff7a3d; --hotbg:#ffe9df; --rec:#3fb06a; --recbg:#e3f6ea;
    --coin:#e79a1e; --shell:#5f9bd8; --lack:#c8657f; --ok:#2f9e7d;
    --shadow:0 6px 18px rgba(120,90,40,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;
    -webkit-font-smoothing:antialiased;padding:0 0 80px}
  .wrap{max-width:820px;margin:0 auto;padding:0 14px}
  /* 상단 페이지 네비 */
  .topnav{display:flex;gap:6px;padding:12px 0 0}
  .topnav a{flex:1;text-align:center;text-decoration:none;padding:10px 8px;border-radius:12px;font-size:14px;font-weight:800;
    color:var(--sub);background:#fff5e4;box-shadow:inset 0 0 0 1px var(--line)}
  .topnav a.cur{color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:var(--shadow)}
  header{padding:16px 0 6px;text-align:center}
  header .logo{width:56px;height:56px;margin:0 auto 6px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  header .logo img{width:100%;height:100%;object-fit:cover;display:block}
  header h1{margin:0;font-size:21px;letter-spacing:-.5px}
  .evchip{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:var(--gold2);background:#fff2d4;padding:6px 12px;border-radius:10px}

  .tabs{display:flex;gap:8px;margin:14px 0 12px}
  .tab{flex:1;border:none;cursor:pointer;padding:12px 8px;border-radius:13px;font-size:15px;font-weight:700;
    color:var(--sub);background:#fff5e4;box-shadow:inset 0 0 0 1px var(--line)}
  .tab.active{color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:var(--shadow)}

  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card h2 .r{margin-left:auto;font-size:12px;color:var(--sub);font-weight:700}
  .hint{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}

  /* 상품 그리드 */
  .seclbl{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 6px;letter-spacing:.3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .it{position:relative;border:none;cursor:pointer;background:#fff5e4;border-radius:14px;padding:8px 6px 8px;
    box-shadow:inset 0 0 0 1px var(--line);text-align:center;color:var(--ink);transition:transform .08s}
  .it:active{transform:scale(.96)}
  .it.sel{box-shadow:inset 0 0 0 2.5px var(--gold2);background:#fff}
  .it img{width:64px;height:64px;border-radius:12px;display:block;margin:0 auto}
  .it .q{position:absolute;right:10px;top:54px;font-size:11px;font-weight:800;color:#fff;background:rgba(60,45,25,.8);
    padding:1px 6px;border-radius:7px}
  .it .nm{font-size:11.5px;font-weight:700;margin-top:6px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .pr{font-size:12px;font-weight:800;color:var(--coin);margin-top:2px}
  .it .pr::before{content:"◉";font-size:10px;margin-right:2px}
  .it .bd{position:absolute;left:6px;top:6px;font-size:9.5px;font-weight:900;padding:2px 6px;border-radius:7px;color:#fff}
  .bd.hot{background:var(--hot)} .bd.rec{background:var(--rec)}
  .it .cnt{position:absolute;right:6px;top:6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold2);color:#fff;
    font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* 장바구니 */
  .cart{display:flex;flex-direction:column;gap:8px}
  .ci{display:flex;align-items:center;gap:10px;background:#fff5e4;border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--line)}
  .ci img{width:40px;height:40px;border-radius:9px}
  .ci .t{flex:1;min-width:0}
  .ci .t b{font-size:13.5px;display:block}
  .ci .t small{font-size:11.5px;color:var(--sub);font-weight:700}
  .step{display:flex;align-items:center;gap:4px}
  .step button{width:30px;height:30px;border:none;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);
    font-size:16px;font-weight:800;color:var(--gold2);cursor:pointer}
  .step input{width:44px;text-align:center;border:none;background:#fff;border-radius:9px;height:30px;font-weight:800;font-size:14px;
    box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
  .step .u{font-size:11px;color:var(--sub);font-weight:800;width:22px}
  .step .mx{width:auto;padding:0 8px;font-size:11px;color:#fff;background:var(--gold2);box-shadow:none}
  .ci .sum{font-size:13px;font-weight:800;color:var(--coin);white-space:nowrap;min-width:64px;text-align:right}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 8px;font-weight:700}

  /* 코인 장부 */
  .ledger{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
  .ledger .k{color:var(--sub);font-weight:700}
  .ledger .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .ledger .tot{border-top:2px solid var(--line);padding-top:6px;margin-top:2px;font-size:14px}
  .ledger .tot.k{color:var(--ink)}
  .ledger .neg{color:var(--lack)}
  .ledger .pos{color:var(--ok)}
  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#f2e6cf;margin:10px 0 4px}
  .bar span{display:block;height:100%}
  .b-free{background:#8fd0b5}.b-quest{background:#5fbf95}.b-jour{background:#3fa77c}.b-shell{background:var(--shell)}.b-pack{background:var(--gold)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;color:var(--sub);font-weight:700}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .toggle{display:flex;align-items:center;gap:10px;background:#fff5e4;border-radius:12px;padding:10px 12px;margin-top:10px;
    box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:700;cursor:pointer}
  .toggle input{width:20px;height:20px;accent-color:var(--gold2)}
  .toggle small{color:var(--sub);font-weight:700;margin-left:auto;white-space:nowrap}

  /* 결과 */
  .plans{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:640px){.plans{grid-template-columns:repeat(3,1fr)}}
  .plan{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;position:relative;overflow:hidden}
  .plan .tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 9px;border-radius:8px;color:#fff;margin-bottom:8px}
  .tag.fit{background:var(--gold2)} .tag.more{background:var(--ok)} .tag.less{background:var(--lack)}
  .plan .price{font-size:24px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .plan .price small{font-size:12px;color:var(--sub);font-weight:700;margin-left:4px}
  .plan ul{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
  .plan li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
  .plan li b{font-weight:800}
  .plan li .d{color:var(--sub);font-size:11.5px;font-weight:700}
  .plan .foot{margin-top:10px;padding-top:8px;border-top:2px solid var(--line);font-size:12.5px;font-weight:800;display:flex;justify-content:space-between}
  .plan .foot .neg{color:var(--lack)}.plan .foot .pos{color:var(--ok)}
  .plan.best{box-shadow:0 0 0 2px var(--gold2),var(--shadow)}

  /* 예산 모드 */
  .budgetrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .budgetrow input{flex:1;min-width:140px;border:none;background:#fff5e4;border-radius:12px;padding:12px 14px;font-size:18px;font-weight:900;
    color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
  .budgetrow input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:none;cursor:pointer;padding:9px 12px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--sub);
    background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .chip.on{color:#fff;background:linear-gradient(180deg,var(--gold),var(--gold2))}
  .scope{display:flex;gap:6px;margin:10px 0 8px}
  .scope .chip{flex:1;text-align:center}
  table.buy{width:100%;border-collapse:collapse;font-size:13px}
  table.buy th{font-size:11.5px;color:var(--sub);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.buy th.l,table.buy td.l{text-align:left}
  table.buy td{padding:7px 6px;text-align:right;border-bottom:1px solid #f6ecd8;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.buy td.l{display:flex;align-items:center;gap:8px;font-weight:700}
  table.buy td.l img{width:30px;height:30px;border-radius:8px}
  table.buy td.l .bd{font-size:9px;font-weight:900;padding:1px 5px;border-radius:6px;color:#fff}
  table.buy tfoot td{font-weight:900;background:#fbf1dd;border-top:2px solid var(--line)}
  .part{color:var(--lack);font-weight:800}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a class="cur" href="index.html">💰 이벤트 효율계산기</a>
    <a href="kvk.html">🛡️ KvK 통계</a>
  </nav>
  <header>
    <div class="logo"><img src="logo.png" alt="KOR 737"></div>
    <h1>이벤트 과금효율 계산기</h1>
    <span class="evchip" id="evchip"></span>
  </header>

  <div class="tabs">
    <button class="tab active" data-mode="goal">🎯 상품 → 패키지</button>
    <button class="tab" data-mode="budget">💳 예산 → 구성</button>
  </div>

  <!-- ===== 공통: 무료 코인 장부 ===== -->
  <div class="card" id="ledgerCard">
    <h2>무료로 모이는 코인 <span class="r" id="daysLbl"></span></h2>
    <div class="ledger" id="ledger"></div>
    <label class="toggle"><input type="checkbox" id="dbl"> 보상2배 패키지 구매 (특훈 코인 2배) <small id="dblNote"></small></label>
  </div>

  <!-- ===== 모드 1: 상품 → 패키지 ===== -->
  <div id="view-goal">
    <div class="card">
      <h2>사고 싶은 상품을 눌러 담기 <span class="r">HOT는 일수, 나머지는 개수</span></h2>
      <div class="seclbl">🔥 일일 특가 (매일 재공급)</div>
      <div class="grid" id="g-hot"></div>
      <div class="seclbl">👍 추천</div>
      <div class="grid" id="g-rec"></div>
      <div class="seclbl">일반</div>
      <div class="grid" id="g-normal"></div>
    </div>
    <div class="card">
      <h2>담은 상품 <span class="r" id="cartSum"></span></h2>
      <div class="cart" id="cart"></div>
    </div>
    <div class="card" id="needCard">
      <h2>필요한 코인</h2>
      <div class="ledger" id="need"></div>
    </div>
    <div id="goalPlans" class="plans"></div>
    <div class="hint" id="goalHint"></div>
  </div>

  <!-- ===== 모드 2: 예산 → 구성 ===== -->
  <div id="view-budget" style="display:none">
    <div class="card">
      <h2>예산</h2>
      <div class="budgetrow">
        <input id="budget" type="number" inputmode="numeric" min="0" step="1000" value="200000"> <span style="font-weight:800">원</span>
      </div>
      <div class="chips" style="margin-top:8px">
        <button class="chip" data-b="50000">5만</button><button class="chip" data-b="100000">10만</button>
        <button class="chip on" data-b="200000">20만</button><button class="chip" data-b="300000">30만</button>
        <button class="chip" data-b="500000">50만</button><button class="chip" data-b="1000000">100만</button>
      </div>
    </div>
    <div id="budgetPack" class="plans" style="grid-template-columns:1fr"></div>
    <div class="card">
      <h2>이 코인으로 살 수 있는 상품 <span class="r" id="buyCoinLbl"></span></h2>
      <div class="scope">
        <button class="chip on" data-scope="hot">HOT만</button>
        <button class="chip" data-scope="rec">HOT + 추천</button>
        <button class="chip" data-scope="all">전체</button>
      </div>
      <table class="buy"><thead><tr><th class="l">상품</th><th>구매</th><th>수량</th><th>코인</th></tr></thead>
        <tbody id="buyBody"></tbody><tfoot id="buyFoot"></tfoot></table>
      <div class="hint" id="capNote"></div>
      <div class="hint">구매 순서: HOT → 추천 → 일반(코인 싼 순). 각 상품은 한도(일일 재공급 × 일수, 또는 잔여)까지 담습니다. 마지막 상품은 남은 코인만큼 일부 구매.</div>
    </div>
  </div>

  <footer>데이터는 관리자만 갱신할 수 있습니다 · Made for KOR 737</footer>
</div>

<script src="items.js"></script>
<script src="event-2026-08.js"></script>
<script>
(function(){
  const EV=window.EVENT_DATA, ITEMS=window.ITEMS;
  const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
  const fmt=n=>Math.round(n).toLocaleString('ko-KR');
  const won=n=>'₩'+fmt(n);
  const D=EV.days;
  EV.shop.forEach((s,i)=>{s.idx=i; s.cap = s.type==='hot' ? (s.daily||1)*D : (s.stock||9999);});

  /* ---------- 무료 코인 ---------- */
  let dbl=false;
  function freeCoins(){
    const free=EV.freeDaily.coin*D, quest=EV.dailyQuest.coin*D*(dbl?2:1), jour=EV.journey.coin;
    const shell=EV.freeDaily.shell*D+EV.dailyQuest.shell*D+EV.journey.shell;
    return {free,quest,jour,shell,coin:free+quest+jour};
  }
  function shellBonus(total){ return EV.shellTiers.reduce((a,t)=>a+(total>=t.shell?t.coin:0),0); }
  function nextTier(total){ return EV.shellTiers.find(t=>total<t.shell); }

  function renderLedger(){
    const f=freeCoins(); const bonus=shellBonus(f.shell); const nt=nextTier(f.shell);
    $('#daysLbl').textContent=`${D}일 기준`;
    $('#ledger').innerHTML=`
      <div class="k">무료 모험 코인 패키지 (${EV.freeDaily.coin}×${D}일)</div><div class="v">${fmt(f.free)}</div>
      <div class="k">일일 특수훈련 (${EV.dailyQuest.coin}×${D}일${dbl?' ×2':''})</div><div class="v">${fmt(f.quest)}</div>
      <div class="k">여정 속 나그네 (최대 달성)</div><div class="v">${fmt(f.jour)}</div>
      <div class="k">상점포인트 보상 (조개 ${fmt(f.shell)}개${nt?` · 다음 구간 ${fmt(nt.shell)}`:''})</div><div class="v">${fmt(bonus)}</div>
      <div class="k tot">무료 코인 합계</div><div class="v tot">${fmt(f.coin+bonus)}</div>`;
    const extra=EV.dailyQuest.coin*D;
    $('#dblNote').textContent=`+${extra}코인 / ${won(EV.doublePack.price)} (${fmt(EV.doublePack.price/extra)}원/코인)`;
  }
  $('#dbl').addEventListener('change',e=>{dbl=e.target.checked;renderLedger();renderGoal();renderBudget();});

  /* ---------- 패키지 조합 탐색 ---------- */
  // 모든 조합을 열거 (일일한도×일수 범위). 반환: {counts, cost, packCoin, packShell}
  function* combos(maxCoinCap,maxCost=Infinity){
    const P=EV.packages, n=P.length, counts=new Array(n).fill(0);
    function* rec(i,cost,coin,shell){
      if(i===n){ yield {counts:counts.slice(),cost,coin,shell}; return; }
      const lim=(P[i].daily||1)*D;
      for(let c=0;c<=lim;c++){
        const nc=coin+P[i].coin*c;
        if(c>0 && nc-P[i].coin>=maxCoinCap) break;   // 이미 목표 훨씬 초과 → 더 담을 필요 없음
        if(cost+P[i].price*c>maxCost) break;
        counts[i]=c;
        yield* rec(i+1,cost+P[i].price*c,nc,shell+P[i].shell*c);
      }
      counts[i]=0;
    }
    yield* rec(0,0,0,0);
  }
  function totalCoin(cb){ const f=freeCoins(); return f.coin+cb.coin+shellBonus(f.shell+cb.shell); }
  function packList(cb){
    return EV.packages.map((p,i)=>cb.counts[i]?{p,c:cb.counts[i]}:null).filter(Boolean);
  }
  function planHTML(tag,cls,title,cb,target,extra){
    const tot=totalCoin(cb), diff=tot-target, f=freeCoins();
    const rows=packList(cb).map(x=>`<li><span>${x.p.name} <span class="d">×${x.c}</span></span><b>${won(x.p.price*x.c)}</b></li>`).join('')
      || '<li><span class="d">패키지 구매 없음</span></li>';
    const cost=cb.cost+(dbl?EV.doublePack.price:0);
    return `<div class="plan ${cls==='fit'?'best':''}">
      <span class="tag ${cls}">${tag}</span>
      <div class="price">${won(cost)}<small>${title}</small></div>
      <ul>${rows}${dbl?`<li><span>보상2배 패키지</span><b>${won(EV.doublePack.price)}</b></li>`:''}</ul>
      <div class="foot"><span>코인 ${fmt(tot)} <span class="d">(패키지 ${fmt(cb.coin)} + 무료 ${fmt(tot-cb.coin)} · 조개 ${fmt(f.shell+cb.shell)})</span></span>
        <span class="${diff<0?'neg':'pos'}">${diff<0?'부족 '+fmt(-diff):'남음 '+fmt(diff)}</span></div>
      ${extra||''}</div>`;
  }

  /* ---------- 모드 1 ---------- */
  const cart=new Map(); // idx -> n (hot: 일수, else 개수)
  function unitOf(s){return s.type==='hot'?'일':'개';}
  function buysOf(s,n){return s.type==='hot'?n*(s.daily||1):n;}
  function coinOf(s,n){return buysOf(s,n)*s.coin;}

  function renderGrid(){
    ['hot','rec','normal'].forEach(t=>{
      $('#g-'+t).innerHTML=EV.shop.filter(s=>s.type===t).map(s=>{
        const it=ITEMS[s.item]||{name:s.item,icon:''}; const n=cart.get(s.idx)||0;
        return `<button class="it ${n?'sel':''}" data-i="${s.idx}">
          ${t!=='normal'?`<span class="bd ${t}">${t==='hot'?'HOT':'추천'}</span>`:''}
          ${n?`<span class="cnt">${n}${unitOf(s)}</span>`:''}
          <img src="${it.icon}" alt=""><span class="q">${fmt(s.qty)}</span>
          <div class="nm">${it.name}</div><div class="pr">${s.coin}</div></button>`;
      }).join('');
    });
    $$('.it').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.i, s=EV.shop[i];
      if(cart.has(i)) cart.delete(i); else cart.set(i, s.type==='hot'?D:1);
      renderGrid(); renderGoal();
    }));
  }
  function setN(i,n){ const s=EV.shop[i]; const max=s.type==='hot'?D:s.cap; n=Math.max(0,Math.min(max,n|0)); if(n===0)cart.delete(i); else cart.set(i,n); renderGrid(); renderGoal(); }

  function renderGoal(){
    // 장바구니
    const rows=[...cart.entries()].map(([i,n])=>{
      const s=EV.shop[i], it=ITEMS[s.item]; const max=s.type==='hot'?D:s.cap;
      const sub=s.type==='hot'?`매일 ${s.daily}개 × ${n}일 = ${buysOf(s,n)}개 · 총 ${fmt(s.qty*buysOf(s,n))}${it.name}`:`${s.coin}코인 × ${n} · 총 ${fmt(s.qty*n)}${it.name} (한도 ${max})`;
      return `<div class="ci"><img src="${it.icon}" alt=""><div class="t"><b>${it.name} <span class="bd ${s.type}" style="font-size:9px;padding:1px 5px;border-radius:6px;color:#fff;${s.type==='normal'?'display:none':''}">${s.type==='hot'?'HOT':'추천'}</span></b><small>${sub}</small></div>
        <div class="step"><button data-d="-1" data-i="${i}">−</button><input data-i="${i}" type="number" value="${n}" min="0" max="${max}"><button data-d="1" data-i="${i}">+</button><span class="u">${unitOf(s)}</span><button class="mx" data-max="${max}" data-i="${i}" title="최대">MAX</button></div>
        <div class="sum">${fmt(coinOf(s,n))}</div></div>`;
    });
    $('#cart').innerHTML=rows.join('')||'<div class="empty">위에서 상품을 눌러 담아 주세요</div>';
    $$('#cart .step button:not(.mx)').forEach(b=>b.addEventListener('click',()=>setN(+b.dataset.i,(cart.get(+b.dataset.i)||0)+(+b.dataset.d))));
    $$('#cart .step .mx').forEach(b=>b.addEventListener('click',()=>setN(+b.dataset.i,+b.dataset.max)));
    $$('#cart .step input').forEach(el=>el.addEventListener('change',()=>setN(+el.dataset.i,+el.value)));

    const target=[...cart.entries()].reduce((a,[i,n])=>a+coinOf(EV.shop[i],n),0);
    $('#cartSum').textContent=target?`총 ${fmt(target)}코인`:'';
    const f=freeCoins(), freeTot=f.coin+shellBonus(f.shell), need=target-freeTot;
    $('#need').innerHTML=`<div class="k">담은 상품 코인</div><div class="v">${fmt(target)}</div>
      <div class="k">− 무료 코인 (조개 보상 포함)</div><div class="v">${fmt(freeTot)}</div>
      <div class="k tot">패키지로 채울 코인</div><div class="v tot ${need>0?'neg':'pos'}">${need>0?fmt(need):'0 (무료로 충분)'}</div>
      `;

    if(!target){ $('#goalPlans').innerHTML=''; $('#goalHint').textContent=''; return; }
    if(need<=0){ $('#goalPlans').innerHTML=planHTML('무료로 충분','more','패키지 불필요',{counts:EV.packages.map(()=>0),cost:0,coin:0,shell:0},target); $('#goalHint').textContent=''; return; }

    // 탐색
    let suff=[], lack=[];
    for(const cb of combos(need+2500)){
      const tot=totalCoin(cb);
      if(tot>=target) suff.push({cb,tot}); else lack.push({cb,tot});
    }
    suff.sort((a,b)=>a.cb.cost-b.cb.cost||a.tot-b.tot);
    const A=suff[0];
    // B: A보다 조개 구간을 하나 더 넘기는 최저가 (누적 보상 코인 추가 획득)
    const fs=freeCoins().shell, aShell=fs+A.cb.shell, nt=nextTier(aShell);
    const B=nt? suff.find(x=>fs+x.cb.shell>=nt.shell) : null;
    lack=lack.filter(x=>x.cb.cost<A.cb.cost).sort((a,b)=>b.tot-a.tot||a.cb.cost-b.cb.cost);
    const C=lack[0];
    let html='';
    html+=planHTML('A · 최저가로 충족','fit','가장 싸게 채움',A.cb,target);
    if(B) html+=planHTML(`B · 조개 ${fmt(nt.shell)} 구간 달성`,'more',`+${fmt(nt.coin)}코인 보상 확보`,B.cb,target);
    if(C) html+=planHTML('C · 부족안','less','한 단계 아래로',C.cb,target);
    $('#goalPlans').innerHTML=html;
    $('#goalHint').textContent=`패키지 구매 한도: 각 매일 1회(레전드 3회) × ${D}일. 코인당 가격: 1,500원 팩 75원 → 3,000원 75원 → 7,500원 94원 → 15,000원 125원 → 30,000원 150원 → 79,000원 158원 → 149,000원 149원. 싼 팩부터 한도까지 채우는 게 기본이고, 조개 누적 보상 구간(2,000·3,000·5,000)을 넘기는지에 따라 총액이 갈립니다.`;
  }

  /* ---------- 모드 2 ---------- */
  let budget=200000, scope='hot', bestCB=null;
  function renderBudget(){
    const b=Math.max(0,budget-(dbl?EV.doublePack.price:0));
    let best=null;
    for(const cb of combos(1e12,b)){
      const tot=totalCoin(cb);
      if(!best||tot>best.tot||(tot===best.tot&&cb.cost<best.cb.cost)) best={cb,tot};
    }
    bestCB=best;
    const remain=budget-best.cb.cost-(dbl?EV.doublePack.price:0);
    $('#budgetPack').innerHTML=planHTML('예산 내 최대 코인','fit',`예산 ${won(budget)}`,best.cb,0,
      `<div class="hint">남는 예산 ${won(remain)} · 패키지 코인당 ${best.cb.coin?(Math.round(best.cb.cost/best.cb.coin*10)/10).toLocaleString('ko-KR'):'-'}원</div>`)
      .replace(/<span class="(neg|pos)">.*?<\/span>/,'');
    renderBuy(best.tot);
  }
  function renderBuy(coins){
    $('#buyCoinLbl').textContent=`${fmt(coins)}코인`;
    const list=EV.shop.filter(s=>scope==='all'||s.type==='hot'||(scope==='rec'&&s.type==='rec'))
      .sort((a,b)=>{const o={hot:0,rec:1,normal:2}; return o[a.type]-o[b.type]||(a.type==='normal'?a.coin-b.coin:0)||a.idx-b.idx;});
    let left=coins, rows=[], used=0;
    for(const s of list){
      const it=ITEMS[s.item]; const can=Math.min(s.cap,Math.floor(left/s.coin)); if(can<=0) continue;
      const partial=can<s.cap; left-=can*s.coin; used+=can*s.coin;
      rows.push(`<tr><td class="l"><img src="${it.icon}" alt="">${it.name}${s.type!=='normal'?`<span class="bd ${s.type}">${s.type==='hot'?'HOT':'추천'}</span>`:''}</td>
        <td>${can}${partial?`<span class="part"> /${s.cap}</span>`:` /${s.cap}`}</td><td>${fmt(can*s.qty)}</td><td>${fmt(can*s.coin)}</td></tr>`);
    }
    $('#buyBody').innerHTML=rows.join('')||'<tr><td colspan="4" class="empty">코인이 부족합니다</td></tr>';
    $('#buyFoot').innerHTML=`<tr><td class="l">합계</td><td></td><td></td><td>${fmt(used)}</td></tr><tr><td class="l">남는 코인</td><td></td><td></td><td>${fmt(left)}</td></tr>`;
    // 이 범위를 전부 사는 데 필요한 최소 패키지
    const capCoin=list.reduce((a,s)=>a+s.cap*s.coin,0);
    const f=freeCoins(), need=capCoin-(f.coin+shellBonus(f.shell));
    let msg=`이 범위를 <b>전부</b> 사려면 ${fmt(capCoin)}코인`;
    if(need<=0) msg+=' — 무료 코인만으로 충분';
    else{ let best=null; for(const cb of combos(need+2500)){ const t=totalCoin(cb); if(t>=capCoin&&(!best||cb.cost<best.cb.cost||(cb.cost===best.cb.cost&&t<best.tot))) best={cb,tot:t}; }
      if(best) msg+=` — 최소 <b>${won(best.cb.cost)}</b> (${packList(best.cb).map(x=>x.p.name.replace(' 모험 코인 패키지','')+'×'+x.c).join(', ')})`; }
    $('#capNote').innerHTML=msg+(left>0?`<br>지금 예산은 이 범위 한도를 넘습니다. 남는 ${fmt(left)}코인은 다른 범위나 다음 이벤트용.`:'');
  }
  $('#budget').addEventListener('input',e=>{budget=+e.target.value||0;$$('.chips .chip').forEach(c=>c.classList.toggle('on',+c.dataset.b===budget));renderBudget();});
  $$('.chips .chip').forEach(c=>c.addEventListener('click',()=>{budget=+c.dataset.b;$('#budget').value=budget;$$('.chips .chip').forEach(x=>x.classList.toggle('on',x===c));renderBudget();}));
  $$('.scope .chip').forEach(c=>c.addEventListener('click',()=>{scope=c.dataset.scope;$$('.scope .chip').forEach(x=>x.classList.toggle('on',x===c));if(bestCB)renderBuy(bestCB.tot);}));

  /* ---------- 탭 ---------- */
  $$('.tabs .tab').forEach(t=>t.addEventListener('click',()=>{
    $$('.tabs .tab').forEach(x=>x.classList.toggle('active',x===t));
    const m=t.dataset.mode; $('#view-goal').style.display=m==='goal'?'':'none'; $('#view-budget').style.display=m==='budget'?'':'none';
  }));

  $('#evchip').textContent=`${EV.name} · ${EV.id} · ${D}일`;
  renderLedger(); renderGrid(); renderGoal(); renderBudget();
})();
</script>
</body>
